[project]
name = "crow-chinese-dictionary"
version = "0.1.0"
description = "Source-attested Chinese vocabulary gap discovery and auditable multilingual dictionary drafts"
requires-python = ">=3.10"
license = {text = "MIT (code); separately licensed data"}
dependencies = []

[project.scripts]
crowdict-inventory = "crowdict.inventory:main"
crowdict-generate = "crowdict.generate:main"
crowdict-validate = "crowdict.validate:main"
crowdict-review = "crowdict.review:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crowdict*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
crowdict = ["data/*.json"]
